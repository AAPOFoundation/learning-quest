<!doctype html><html><head><meta charset="utf-8"><title>light probe</title></head>
<body style="margin:0;background:#000">
<pre id="out" style="position:absolute;left:-4000px">running</pre>
<iframe id="game" style="width:1280px;height:800px;border:0"></iframe>
<script src="shared/art.js"></script>
<script src="shared/fx2.js"></script>
<script>
(function(){
var log=[];
function say(s){log.push(s)}
function px(c,x,y){var d=c.getContext('2d').getImageData(x|0,y|0,1,1).data;return [d[0],d[1],d[2]]}
try{
 window.LQFx.set(false);
 var look={skin:'#e2b48c',hair:'#3b2a1d',robe:'#274a7a',trim:'#d7b56a',hat:'cap'};
 var fc=document.createElement('canvas');fc.width=fc.height=220;var g=fc.getContext('2d');
 g.fillStyle='#88cc66';g.fillRect(0,0,220,220);
 Art.figure(g,100,80,look,{t:0,face:1});
 var feetY=80+Art.S*0.38, sx=100+6.5, sy=feetY+2.8;
 var sh=px(fc,sx,sy), grass=px(fc,12,12);
 say('shadow2d '+(sh[1]<grass[1]-15?'ok':'FAIL')+' sh='+sh+' grass='+grass+' at '+sx.toFixed(0)+','+sy.toFixed(0));
 window.LQFx.set(true);
 g.fillStyle='#88cc66';g.fillRect(0,0,220,220);
 Art.figure(g,100,80,look,{t:0,face:1});
 var mid=px(fc,100,feetY+1), side=px(fc,sx+8,sy+2);
 say('low-shadow centred darker='+(mid[1]<side[1]?'ok':'note')+' mid='+mid+' side='+side);
 window.LQFx.set(false);
 var port=Art.portrait(look,40);say('portrait '+(port&&port.indexOf('data:')===0?'ok':'FAIL'));
}catch(e){say('figure FAIL '+e.message)}
var src=document.createElement('canvas');src.width=320;src.height=180;var sg=src.getContext('2d');
sg.fillStyle='#1a2830';sg.fillRect(0,0,320,180);
sg.fillStyle='#e6c56a';sg.fillRect(156,86,8,8);
var stage=document.createElement('div');stage.id='stage';stage.style.cssText='position:absolute;width:320px;height:180px;left:0;top:0';document.body.appendChild(stage);
var light={x:160,y:30,r:55,c:[0.9,0.65,0.2]};
var shadow={x:160,y:140,r:28};
function run(key,lights,shadows){
 window.LQLight.watch([[160,30],[160,140],[8,8],[160,90]]);
 var ok=window.LQLight.frame(src,lights,shadows,key,stage);
 return {ok:ok,err:window.LQLight.error(),lim:window.LQLight.limits(),s:window.LQLight.sample()};
}
try{
 var py=run('python-basics',[light],[shadow]);
 var ev=run('ai-evals',[],[]);
 var lo=window.LQFx.low;window.LQFx.set(true);var hid=run('python-basics',[light],[]);window.LQFx.set(false);
 var glc=document.getElementById('lqgl');
 say('shader '+(py.err?'FAIL '+py.err:'ok')+' limits '+JSON.stringify(py.lim)+' frame '+py.ok);
 say('sample py '+JSON.stringify(py.s));
 say('sample ev '+JSON.stringify(ev.s));
 if(py.s&&ev.s){
  var a=py.s.pts[3], b=ev.s.pts[3];
  say('grade '+(b[2]>a[2]?'ok evals bluer':'FAIL evals not bluer')+' py='+a+' ev='+b);
  var top=py.s.pts[0], feet=py.s.pts[1], corner=py.s.pts[2];
  say('light '+(top[0]>corner[0]+8?'ok':'FAIL')+' top='+top+' corner='+corner);
  say('shad '+(feet[0]<corner[0]-4?'ok':'note')+' feet='+feet+' corner='+corner);
 }
 var vis=glc?glc.style.visibility:'missing';
 say('low-hides '+(hid.ok===false && vis==='hidden'?'ok':'FAIL')+' vis='+vis+' hidOk='+hid.ok);
}catch(e){say('gl FAIL '+e.message)}
localStorage.setItem('learning-apps.fx','full');
try{localStorage.removeItem('learning-apps.python-basics')}catch(e){}
var fr=document.getElementById('game');
fr.onload=function(){
 setTimeout(function(){
  var w=fr.contentWindow, d=w.document, lines=[];
  try{
   lines.push('game LQLight '+(w.LQLight? 'yes err='+JSON.stringify(w.LQLight.error()):'MISSING'));
   lines.push('fxLow '+!!(w.LQFx&&w.LQFx.low));
   var btn=d.getElementById('tn')||d.getElementById('tc');
   lines.push('titleBtn '+(btn?btn.textContent:'none'));
   if(btn)btn.click();
  }catch(e){lines.push('boot FAIL '+e.message)}
  setTimeout(function(){
   try{
    var gl=d.getElementById('lqgl');
    lines.push('overlay '+(gl?gl.style.visibility+' z='+gl.style.zIndex:'MISSING'));
    lines.push('limits '+JSON.stringify(w.LQLight.limits()));
    w.__w.warp('t0',7,8);
   }catch(e){lines.push('warp FAIL '+e.message)}
   setTimeout(function(){
    try{
     var cv=d.getElementById('cv'), hw=cv.width, hh=cv.height;
     w.LQLight.watch([[(hw/2)|0,(hh/2)|0],[12,12],[(hw/2)|0,((hh/2)+40)|0]]);
     w.__w.draw();
     var s=w.LQLight.sample();
     lines.push('town sample '+JSON.stringify(s));
     if(s&&s.pts){
      var c=s.pts[0], k=s.pts[1], feet=s.pts[2];
      lines.push('hero-light '+(c[0]+c[1]>k[0]+k[1]+6?'ok':'FAIL')+' centre='+c+' corner='+k);
      lines.push('hero-shadow '+(feet[0]+feet[1]<c[0]+c[1]-8?'ok':'note')+' feet='+feet);
     } else lines.push('town sample FAIL');
     w.LQFx.set(true);w.__w.draw();
     var gl2=d.getElementById('lqgl');
     lines.push('game-low '+(gl2&&gl2.style.visibility==='hidden'?'ok':'FAIL')+' vis='+(gl2&&gl2.style.visibility));
     w.LQFx.set(false);w.__w.draw();
     var stage=document.getElementById('stage');if(stage)stage.style.display='none';
     say(lines.join(' | '));
     document.getElementById('out').textContent=log.join('\n');
     document.title=log.join(' ').indexOf('FAIL')>=0?'PROBE FAIL':'PROBE OK';
    }catch(e){say('sample FAIL '+e.message);document.getElementById('out').textContent=log.join('\n');document.title='PROBE FAIL'}
   },400);
  },500);
 },400);
};
fr.src='python-basics/index.html';
document.getElementById('out').textContent=log.join('\n');
})();
</script>
</body></html>

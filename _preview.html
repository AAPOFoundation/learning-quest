<!doctype html>
<meta charset="utf-8">
<title>camp preview</title>
<style>
body{margin:0;background:#111;color:#f6efe0;font:14px/1.4 system-ui}
#status{padding:6px 10px}
.row{display:flex}
figure{margin:0;width:500px}
canvas{width:500px;height:340px;display:block;background:#121a22}
figcaption{padding:4px 8px}
</style>
<div id="status">loading</div>
<div class="row">
<figure id="a"><canvas></canvas><figcaption>evals meadow</figcaption></figure>
<figure id="b"><canvas></canvas><figcaption>safety highland</figcaption></figure>
</div>
<script src="shared/lq3d-geom.js"></script>
<script src="shared/lq3d.js"></script>
<script>
var hero={skin:'#e2b48c',hair:'#3b2a1d',robe:'#274a7a',trim:'#d7b56a',cape:'#7a2e2a',hat:'hood',staff:true};
var A=LQ3D.mount(document.getElementById('a'),{biome:'meadow',key:'ai-evals',hero:hero});
var B=LQ3D.mount(document.getElementById('b'),{biome:'highland',key:'ai-safety',hero:hero});
setTimeout(function(){
 document.getElementById('status').textContent='evals '+(A.dead?'DEAD':'alive')+' highland '+(B.dead?'DEAD':'alive');
},700);
</script>
